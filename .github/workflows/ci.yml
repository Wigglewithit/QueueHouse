name: QueueHouse checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: queuehouse
          POSTGRES_USER: queuehouse
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queuehouse"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_ENV: development
      DATABASE_URL: postgresql://queuehouse:ci-only-password@localhost:5432/queuehouse
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python manage.py test --settings=config.test_settings
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py import_movies data/starter_movies.csv
      - run: python manage.py collectstatic --noinput
      - name: Check production settings
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          DJANGO_ALLOWED_HOSTS: queuehouse.example
          EMAIL_HOST: smtp.example.com
          DEFAULT_FROM_EMAIL: noreply@example.com
          SUPPORT_EMAIL: support@example.com
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Build deployment image
        run: docker build --tag queuehouse:ci .
      - name: Smoke test production container
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          EMAIL_HOST: smtp.example.com
          DEFAULT_FROM_EMAIL: noreply@example.com
          SUPPORT_EMAIL: support@example.com
        run: |
          docker run --detach --name queuehouse-smoke --network host \
            --env DJANGO_ENV=production --env DJANGO_SECRET_KEY \
            --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            --env DATABASE_URL --env REDIS_URL --env EMAIL_HOST \
            --env DEFAULT_FROM_EMAIL --env SUPPORT_EMAIL \
            --env DJANGO_TRUST_PROXY=true queuehouse:ci
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8000/movies/ > /dev/null
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker inspect queuehouse-smoke > /dev/null 2>&1; then
            docker logs queuehouse-smoke
            docker rm --force queuehouse-smoke
          fi
