{% extends 'base.html' %}
{% block content %}<div class="form-card"><h1>Choose a new password</h1>
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn">Save password</button></form>
{% else %}<p>This link has expired or has already been used. <a href="{% url 'password_reset' %}">Request a new link.</a></p>{% endif %}</div>{% endblock %}
